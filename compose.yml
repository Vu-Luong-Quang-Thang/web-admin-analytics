services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin_analytics
      POSTGRES_PASSWORD: admin_analytics_local
      POSTGRES_DB: admin_analytics
    ports:
      - "55433:5432"
    volumes:
      - admin_analytics_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_analytics -d admin_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  admin_analytics_data:
